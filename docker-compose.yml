# Local development services. Start with `bun run db:up`.
services:
  postgres:
    image: postgres:18
    container_name: lifeos-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lifeos_dev}
      TZ: UTC
    ports:
      - '127.0.0.1:5432:5432' # localhost only, never exposed to the network
    volumes:
      - pgdata:/var/lib/postgresql # Postgres 18+ mounts the parent of the data dir
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
