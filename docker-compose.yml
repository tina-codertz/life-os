# Local development services. Start with `bun run db:up`.
services:
  postgres:
    image: postgres:18
    container_name: lifeos-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lifeos_dev}
      TZ: UTC
    ports:
      # localhost only. Host port 5433 avoids clashing with a natively installed Postgres on 5432.
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql # Postgres 18+ mounts the parent of the data dir
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Catches every email the API sends in development; nothing leaves your machine.
  # Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.0
    container_name: lifeos-mailpit
    ports:
      - '127.0.0.1:1025:1025' # SMTP (the API sends here)
      - '127.0.0.1:8025:8025' # web UI + API (tests read emails here)
    restart: unless-stopped

volumes:
  pgdata:
